name: ✨ Feature Request
description: Suggest a new feature or enhancement for Quantum Pi Forge
title: "[Feature]: "
labels: ["enhancement", "needs-triage", "agent-review"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Our agent system will analyze your request and help scope the implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's the pain point?
      placeholder: Describe the problem or need...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: Describe your ideal solution...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system would this affect?
      options:
        - Backend API (server.js)
        - Frontend (index.html)
        - Pi Network Integration
        - Security/Blacklist System
        - Netlify Deployment
        - GitHub Workflows
        - Documentation
        - New Component
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical - Blocking our usage
        - High - Would significantly improve the project
        - Medium - Nice to have
        - Low - Minor improvement
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions or features have you considered?
      placeholder: Describe alternative approaches...

  - type: textarea
    id: mockups
    attributes:
      label: Mockups or Examples
      description: Visual examples, mockups, or similar features in other projects
      placeholder: Link to examples or drag and drop images...

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: Do you have ideas on how this could be implemented?
      placeholder: Technical implementation suggestions...

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: How complex do you think this feature is?
      options:
        - Simple - Can be done in a few hours
        - Medium - Might take a few days
        - Complex - Could take a week or more
        - Unknown - Not sure
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, use cases, or information
      placeholder: Any additional information...

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to help implement this feature?
      options:
        - label: I'm willing to submit a PR for this feature
          required: false
        - label: I can help test this feature
          required: false
        - label: I can help with documentation
          required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and PRs to ensure this hasn't been requested
          required: true
        - label: I have provided sufficient context and details
          required: true
        - label: This feature aligns with the project's goals
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        **Agent Routing Information**

        This feature request will be automatically:
        - 🏷️ **Categorized** based on component and priority
        - 🤖 **Analyzed** for feasibility by our planning agent
        - 📊 **Scoped** with estimated effort and impact
        - 💡 **Suggestions** provided for implementation approach
        - 👥 **Discussed** with maintainers for roadmap inclusion

        You'll be notified as the feature progresses through planning and development.
